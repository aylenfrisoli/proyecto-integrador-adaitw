<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- favicons: el ico es para navegadores viejos y de los png elige el que necesite segun el tamano -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- color de la barra del navegador en celular, el mismo azul marino de la marca -->
    <meta name="theme-color" content="#0d5a84" />

    <!-- seo basico: lo que muestra google en los resultados -->
    <title>SAF Creaciones para Vos | Sara Figarra</title>
    <meta
      name="description"
      content="SAF Creaciones para Vos: obras, productos y talleres creativos de Sara Figarra, artista plástica, comunicadora social y muralista de la costa argentina."
    />
    <meta name="author" content="Sara Figarra" />

    <!-- open graph y twitter: definen como se ve el link al compartirlo por whatsapp, facebook o instagram -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SAF Creaciones para Vos" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:title" content="SAF Creaciones para Vos | Sara Figarra" />
    <meta
      property="og:description"
      content="SAF Creaciones para Vos: obras, productos y talleres creativos de Sara Figarra, artista plástica, comunicadora social y muralista de la costa argentina."
    />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
